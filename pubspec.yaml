name: fa_flutter_ui_kit
description: Official FA Flutter UI Kit.
version: 1.0.0
homepage: https://github.com/FieldAssist/fa_flutter_ui_kit

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  qr_code_scanner_plus: ^2.0.14
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  file_picker: ^10.3.6
  auto_route: ^10.0.1
  collection: ^1.19.1
  csv_localizations:
    git:
      url: "https://github.com/singhtaranjeet/csv_localizations.git"
      ref: "master"
  cunning_document_scanner: ^2.6.0
  flutter_image_compress: ^2.3.0
  image: ^4.3.0
  image_cropper: ^11.0.0
  mobile_scanner: ^7.4.0
  path: ^1.9.1

  # Core
  fa_flutter_core:
    git:
      url: https://github.com/FieldAssist/fa_flutter_core.git
      ref: main

  # Api service
  fa_flutter_api_client:
    git:
      url: https://github.com/FieldAssist/fa_flutter_api_client.git
      ref: main
  decimal: ^3.2.4
  cool_flare: ^3.1.0
  app_settings: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  auto_route_generator: ^10.3.1
  build_runner: ^2.10.2
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:
  assets:
    - assets/images/
    - assets/flare/
    - assets/data/
    - assets/svg/
    - assets/icons/
    - assets/ui_common/

  fonts:
    - family: Trueno
      fonts:
        - asset: assets/fonts/TruenoBd.otf
          weight: 700
        - asset: assets/fonts/TruenoBdIt.otf
          weight: 700
          style: italic
        - asset: assets/fonts/TruenoLt.otf
          weight: 100
        - asset: assets/fonts/TruenoLtIt.otf
          weight: 100
          style: italic
        - asset: assets/fonts/TruenoRg.otf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins_bd.ttf
          weight: 500
        - asset: assets/fonts/poppins_rg.ttf
          style: normal
        - asset: assets/fonts/poppins_lt.ttf
          weight: 200

